name: "Reusable CodeQL Analysis"

on:
  workflow_call:
    inputs:
      language:
        description: "Language to analyze: 'javascript-typescript', 'python', 'java-kotlin', etc."
        required: true
        type: string
      build-mode:
        description: "Build mode: 'none', 'autobuild', or 'manual'. If omitted, defaults to 'none' for interpreted languages (Python, JS/TS, Ruby) and 'autobuild' for compiled languages."
        required: false
        default: ""
        type: string
      build-command:
        description: "Custom build command when build-mode is 'manual' (e.g. './gradlew assembleDebug')."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Security Scan (${{ inputs.language }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        if: inputs.language == 'java-kotlin'
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        if: inputs.language == 'java-kotlin'
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Determine Build Mode
        id: build-mode
        run: |
          if [ -n "${{ inputs.build-mode }}" ]; then
            MODE="${{ inputs.build-mode }}"
          else
            case "${{ inputs.language }}" in
              python|javascript-typescript|javascript|ruby|actions)
                MODE="none"
                ;;
              *)
                MODE="autobuild"
                ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Selected build mode: $MODE for language: ${{ inputs.language }}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ steps.build-mode.outputs.mode }}
      
      - name: Autobuild
        if: steps.build-mode.outputs.mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4.37.9
      
      - name: Manual Build
        if: steps.build-mode.outputs.mode == 'manual' && inputs.build-command != ''
        run: ${{ inputs.build-command }}
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:${{ inputs.language }}"
