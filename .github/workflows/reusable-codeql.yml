name: "Reusable CodeQL Analysis"

on:
  workflow_call:
    inputs:
      language:
        description: "Language to analyze: 'javascript-typescript', 'python', 'java-kotlin', etc."
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Security Scan (${{ inputs.language }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        if: inputs.language == 'java-kotlin'
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        if: inputs.language == 'java-kotlin'
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ inputs.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:${{ inputs.language }}"
