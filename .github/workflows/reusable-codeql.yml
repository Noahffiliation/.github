name: "Reusable CodeQL Analysis"

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      build-mode:
        required: false
        default: "autobuild"
        type: string
      build-command:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Security Scan (${{ inputs.language }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        if: inputs.language == 'java-kotlin'
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        if: inputs.language == 'java-kotlin'
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}
      - name: Autobuild
        if: inputs.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4.37.9
      - name: Manual Build
        if: inputs.build-mode == 'manual' && inputs.build-command != ''
        run: ${{ inputs.build-command }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:${{ inputs.language }}"
