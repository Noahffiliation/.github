name: "Reusable Node.js CI/CD"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        default: "24.19.0"
        type: string
      run-build:
        description: "Whether to execute build and upload artifacts"
        required: false
        default: true
        type: boolean
      build-output-dir:
        description: "Directory containing build output (e.g. dist, .next, out)"
        required: false
        default: "dist"
        type: string
    secrets:
      SONAR_TOKEN:
        required: false
      VERCEL_TOKEN:
        required: false
      DISCORD_WEBHOOK:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v4.2.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Formatting (Prettier / Biome)
        run: npx prettier --check . || npm run format:check || true

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Run Type Check (TypeScript)
        run: npx tsc --noEmit || npm run type-check || true

  test:
    name: Test & Coverage
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v4.2.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Cache SonarQube Scanner
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: SonarQube / SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.1
        with:
          name: node-coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build & Package
    if: inputs.run-build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v4.2.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Cache Next.js / Build Output
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Application Bundle
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: build-artifact
          path: ${{ inputs.build-output-dir }}
          retention-days: 30
