name: "Reusable Node.js CI/CD"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        default: "24.19.0"
        type: string
      run-build:
        description: "Whether to execute build and upload artifacts"
        required: false
        default: true
        type: boolean
      build-output-dir:
        description: "Directory containing build output (e.g. dist, .next, out)"
        required: false
        default: "dist"
        type: string
      test-docker:
        description: "Whether to validate Dockerfile build, scan for vulnerabilities/malware, and generate SBOM"
        required: false
        default: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud API token"
        required: false
      LASTFM_API_KEY:
        required: false
      NEXT_PUBLIC_LASTFM_API_KEY:
        required: false
      TRAKT_API_KEY:
        required: false
      NEXT_PUBLIC_TRAKT_API_KEY:
        required: false
      MONGODB_URI:
        required: false
      CLOUDINARY_NAME:
        required: false
      CLOUDINARY_KEY:
        required: false
      CLOUDINARY_SECRET:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Formatting (Prettier / Biome)
        run: npx prettier --check . || npm run format:check || true

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Run Type Check (TypeScript)
        run: npx tsc --noEmit || npm run type-check || true

  test:
    name: Test & Coverage
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Injected directly from calling repository's GitHub Secrets and Variables
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      NEXT_PUBLIC_LASTFM_API_KEY: ${{ secrets.NEXT_PUBLIC_LASTFM_API_KEY || vars.NEXT_PUBLIC_LASTFM_API_KEY }}
      NEXT_PUBLIC_LASTFM_USERNAME: ${{ vars.NEXT_PUBLIC_LASTFM_USERNAME || secrets.NEXT_PUBLIC_LASTFM_USERNAME }}
      NEXT_PUBLIC_BACKLOGGD_USERNAME: ${{ vars.NEXT_PUBLIC_BACKLOGGD_USERNAME || secrets.NEXT_PUBLIC_BACKLOGGD_USERNAME }}
      NEXT_PUBLIC_MAL_USERNAME: ${{ vars.NEXT_PUBLIC_MAL_USERNAME || secrets.NEXT_PUBLIC_MAL_USERNAME }}
      NEXT_PUBLIC_MDL_USERNAME: ${{ vars.NEXT_PUBLIC_MDL_USERNAME || secrets.NEXT_PUBLIC_MDL_USERNAME }}
      NEXT_PUBLIC_TRAKT_API_KEY: ${{ secrets.NEXT_PUBLIC_TRAKT_API_KEY || secrets.TRAKT_API_KEY }}
      NEXT_PUBLIC_TRAKT_USERNAME: ${{ vars.NEXT_PUBLIC_TRAKT_USERNAME || secrets.NEXT_PUBLIC_TRAKT_USERNAME }}
      TRAKT_API_KEY: ${{ secrets.TRAKT_API_KEY }}
      NOTION_KEY: ${{ secrets.NOTION_KEY || secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID || vars.NOTION_DATABASE_ID }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
      CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_KEY }}
      CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Cache SonarQube Scanner
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: SonarQube / SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: node-coverage-report
          path: coverage/
          retention-days: 30

  dependency-review:
    name: Dependency Vulnerability Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v4.5.0
        continue-on-error: true

  build:
    name: Build & Package
    if: inputs.run-build
    runs-on: ubuntu-24.04
    env:
      # Injected directly from calling repository's GitHub Secrets and Variables
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      NEXT_PUBLIC_LASTFM_API_KEY: ${{ secrets.NEXT_PUBLIC_LASTFM_API_KEY || vars.NEXT_PUBLIC_LASTFM_API_KEY }}
      NEXT_PUBLIC_LASTFM_USERNAME: ${{ vars.NEXT_PUBLIC_LASTFM_USERNAME || secrets.NEXT_PUBLIC_LASTFM_USERNAME }}
      NEXT_PUBLIC_BACKLOGGD_USERNAME: ${{ vars.NEXT_PUBLIC_BACKLOGGD_USERNAME || secrets.NEXT_PUBLIC_BACKLOGGD_USERNAME }}
      NEXT_PUBLIC_MAL_USERNAME: ${{ vars.NEXT_PUBLIC_MAL_USERNAME || secrets.NEXT_PUBLIC_MAL_USERNAME }}
      NEXT_PUBLIC_MDL_USERNAME: ${{ vars.NEXT_PUBLIC_MDL_USERNAME || secrets.NEXT_PUBLIC_MDL_USERNAME }}
      NEXT_PUBLIC_TRAKT_API_KEY: ${{ secrets.NEXT_PUBLIC_TRAKT_API_KEY || secrets.TRAKT_API_KEY }}
      NEXT_PUBLIC_TRAKT_USERNAME: ${{ vars.NEXT_PUBLIC_TRAKT_USERNAME || secrets.NEXT_PUBLIC_TRAKT_USERNAME }}
      TRAKT_API_KEY: ${{ secrets.TRAKT_API_KEY }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
      CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_KEY }}
      CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Cache Next.js / Build Output
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Application Bundle
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-artifact
          path: ${{ inputs.build-output-dir }}
          retention-days: 30

  docker-build:
    name: Build Container, Security Scan, SBOM & Publish
    if: inputs.test-docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker Container (Local Daemon)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: app:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1. Trivy Vulnerability & Security Scanner
      - name: Run Trivy Security Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:test-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Container Security SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      # 2. Antivirus / Malware Scan (ClamAV)
      - name: Antivirus & Malware Scan (ClamAV)
        run: |
          sudo apt-get update && sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam || true
          docker save app:test-${{ github.sha }} -o container-image.tar
          if [ -d /var/lib/clamav ] && [ "$(ls -A /var/lib/clamav)" ]; then
            clamscan --infected --recursive container-image.tar
          else
            echo "ClamAV database not loaded, skipping offline signature scan."
          fi
          rm -f container-image.tar

      # 3. Generate Software Bill of Materials (SBOM) via Syft
      - name: Generate SBOM (SPDX JSON format)
        uses: anchore/sbom-action@v0.24.0
        with:
          image: app:test-${{ github.sha }}
          format: 'spdx-json'
          output-file: 'container-sbom.spdx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-sbom
          path: container-sbom.spdx.json
          retention-days: 30

      # 4. Publish Verified Container to GitHub Container Registry (ghcr.io) on main branch
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short

      - name: Push Container to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
