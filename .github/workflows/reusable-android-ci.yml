name: "Reusable Android CI/CD"

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version"
        required: false
        default: "21"
        type: string
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  android-ci:
    name: Android Build, Lint & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Sonar
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Spotless Formatter Check
        continue-on-error: true
        run: ./gradlew spotlessCheck

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload Lint SARIF to GitHub Security
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Run Unit Tests & JaCoCo Coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: SonarCloud Analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --info

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Generate Android Summary
        if: always()
        run: |
          echo "## 🤖 Android CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **JDK Version** | \`${{ inputs.java-version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Outcome** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | \`app-debug-apk\` |" >> $GITHUB_STEP_SUMMARY

  dependency-review:
    name: Dependency Vulnerability Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
