name: "Reusable Python CI/CD"

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        default: "3.12.3"
        type: string
      test-docker:
        description: "Whether to validate Dockerfile build, scan for vulnerabilities/malware, and generate SBOM"
        required: false
        default: false
        type: boolean
      docker-no-cache:
        description: "Whether to build Docker container without cache to fetch latest base image and OS security updates"
        required: false
        default: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud API token"
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint & Format Check (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"

      - name: Cache Ruff & Mypy
        uses: actions/cache@v6.1.0
        with:
          path: |
            .mypy_cache
            .ruff_cache
          key: ${{ runner.os }}-python-lint-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-python-lint-

      - name: Install Linting & Typing Tools
        run: |
          uv pip install --system ruff mypy
          if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi

      - name: Run Ruff Lint
        run: ruff check .

      - name: Check Formatting (Ruff)
        run: ruff format --check .

      - name: Type Check (mypy)
        continue-on-error: true
        run: mypy .

  test:
    name: Test & Coverage (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Injected directly from calling repository's GitHub Secrets and Variables
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID || vars.NOTION_PAGE_ID }}
      TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
      TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME || vars.TRAKT_USERNAME }}
      GOOGLE_SHARE_EMAIL: ${{ secrets.GOOGLE_SHARE_EMAIL || vars.GOOGLE_SHARE_EMAIL }}
      SYNC_GOOGLE: ${{ secrets.SYNC_GOOGLE || vars.SYNC_GOOGLE }}
      BACKLOGGD_USERNAME: ${{ secrets.BACKLOGGD_USERNAME || vars.BACKLOGGD_USERNAME }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REDIRECT_URI: ${{ secrets.REDIRECT_URI || vars.REDIRECT_URI }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME || vars.LASTFM_USERNAME }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID || vars.YOUTUBE_PLAYLIST_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"

      - name: Cache Pytest & Sonar
        uses: actions/cache@v6.1.0
        with:
          path: |
            .pytest_cache
            ~/.sonar/cache
          key: ${{ runner.os }}-pytest-sonar-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pytest-sonar-

      - name: Install Test Dependencies
        run: |
          uv pip install --system pytest pytest-cov pytest-asyncio
          if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi

      - name: Run Pytest with Coverage
        run: pytest --cov=. --cov-report=xml --cov-report=term

      - name: SonarQube / SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🐍 Python CI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python Version** | \`${{ inputs.python-version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Test Outcome** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Coverage Report** | \`coverage.xml\` (uploaded) |" >> $GITHUB_STEP_SUMMARY

  dependency-review:
    name: Dependency Vulnerability Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        continue-on-error: true

  docker-build:
    name: Build Container, Security Scan, SBOM & Publish
    if: inputs.test-docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short

      - name: Determine Image Tags & Target
        id: img-config
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            echo "$META_TAGS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            PRIMARY_TAG=$(echo "$META_TAGS" | head -n 1)
            echo "scan_image=$PRIMARY_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=app:test-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "scan_image=app:test-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Deliver Docker Container
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ steps.img-config.outputs.push == 'true' }}
          load: ${{ steps.img-config.outputs.push != 'true' }}
          pull: true
          no-cache: ${{ inputs.docker-no-cache }}
          tags: ${{ steps.img-config.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1. Grype Vulnerability & Security Scanner (Scans registry image or local daemon directly)
      - name: Run Grype Security Vulnerability Scan
        uses: anchore/scan-action@v7.4.2
        id: grype-scan
        with:
          image: ${{ steps.img-config.outputs.scan_image }}
          output-format: 'sarif'
          output-file: 'grype-results.sarif'
          fail-build: false

      - name: Upload Container Security SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.9
        continue-on-error: true
        with:
          sarif_file: 'grype-results.sarif'
          category: 'container-security'

      - name: Upload Container Security Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        continue-on-error: true
        with:
          name: container-security
          path: grype-results.sarif
          retention-days: 14

      - name: Verify No Fixable High or Critical Vulnerabilities
        uses: anchore/scan-action@v7.4.2
        with:
          image: ${{ steps.img-config.outputs.scan_image }}
          only-fixed: true
          severity-cutoff: high
          fail-build: true

      # 2. Antivirus / Malware Scan (ClamAV with definition caching)
      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache ClamAV Database
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/clamav
          key: clamav-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            clamav-db-${{ runner.os }}-

      - name: Antivirus & Malware Scan (ClamAV)
        run: |
          sudo apt-get update && sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service || true
          mkdir -p ~/.cache/clamav
          if [ -d /var/lib/clamav ] && [ -n "$(ls -A ~/.cache/clamav 2>/dev/null)" ]; then
            sudo cp -rn ~/.cache/clamav/* /var/lib/clamav/ 2>/dev/null || true
          fi
          sudo freshclam || true
          if [ -d /var/lib/clamav ]; then
            cp -rn /var/lib/clamav/* ~/.cache/clamav/ 2>/dev/null || true
          fi
          if [ "${{ steps.img-config.outputs.push }}" = "true" ]; then
            docker pull "${{ steps.img-config.outputs.scan_image }}"
          fi
          docker save "${{ steps.img-config.outputs.scan_image }}" -o container-image.tar
          if [ -d /var/lib/clamav ] && [ -n "$(ls -A /var/lib/clamav 2>/dev/null)" ]; then
            clamscan --infected --recursive container-image.tar
          else
            echo "ClamAV database not loaded, skipping offline signature scan."
          fi
          rm -f container-image.tar

      # 3. Generate Software Bill of Materials (SBOM) via Syft
      - name: Generate SBOM (SPDX JSON format)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ steps.img-config.outputs.scan_image }}
          format: 'spdx-json'
          output-file: 'container-sbom.spdx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-sbom
          path: container-sbom.spdx.json
          retention-days: 14
