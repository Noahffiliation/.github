name: "Reusable Python CI/CD"

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        default: "3.12.3"
        type: string
      test-docker:
        description: "Whether to validate Dockerfile build, scan for vulnerabilities/malware, and generate SBOM"
        required: false
        default: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud API token"
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint & Format Check (Python)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python (with pip cache)
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Cache Ruff & Mypy
        uses: actions/cache@v6.1.0
        with:
          path: |
            .mypy_cache
            .ruff_cache
          key: ${{ runner.os }}-python-lint-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-python-lint-

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff Lint
        run: ruff check .

      - name: Check Formatting (Ruff)
        run: ruff format --check .

      - name: Type Check (mypy)
        run: mypy . || true

  test:
    name: Test & Coverage (Python)
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Injected directly from calling repository's GitHub Secrets and Variables
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID || vars.NOTION_PAGE_ID }}
      TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
      TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME || vars.TRAKT_USERNAME }}
      GOOGLE_SHARE_EMAIL: ${{ secrets.GOOGLE_SHARE_EMAIL || vars.GOOGLE_SHARE_EMAIL }}
      SYNC_GOOGLE: ${{ secrets.SYNC_GOOGLE || vars.SYNC_GOOGLE }}
      BACKLOGGD_USERNAME: ${{ secrets.BACKLOGGD_USERNAME || vars.BACKLOGGD_USERNAME }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REDIRECT_URI: ${{ secrets.REDIRECT_URI || vars.REDIRECT_URI }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME || vars.LASTFM_USERNAME }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID || vars.YOUTUBE_PLAYLIST_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Python (with pip cache)
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Cache Pytest & Sonar
        uses: actions/cache@v6.1.0
        with:
          path: |
            .pytest_cache
            ~/.sonar/cache
          key: ${{ runner.os }}-pytest-sonar-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pytest-sonar-

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest with Coverage
        run: pytest --cov=. --cov-report=xml --cov-report=term

      - name: SonarQube / SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-coverage-report
          path: coverage.xml
          retention-days: 30

  dependency-review:
    name: Dependency Vulnerability Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        continue-on-error: true

  docker-build:
    name: Build Container, Security Scan, SBOM & Publish
    if: inputs.test-docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build Docker Container (Local Daemon)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: app:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1. Trivy Vulnerability & Security Scanner
      - name: Run Trivy Security Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:test-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Container Security SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.8
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      # 2. Antivirus / Malware Scan (ClamAV)
      - name: Antivirus & Malware Scan (ClamAV)
        run: |
          sudo apt-get update && sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam || true
          docker save app:test-${{ github.sha }} -o container-image.tar
          if [ -d /var/lib/clamav ] && [ "$(ls -A /var/lib/clamav)" ]; then
            clamscan --infected --recursive container-image.tar
          else
            echo "ClamAV database not loaded, skipping offline signature scan."
          fi
          rm -f container-image.tar

      # 3. Generate Software Bill of Materials (SBOM) via Syft
      - name: Generate SBOM (SPDX JSON format)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: app:test-${{ github.sha }}
          format: 'spdx-json'
          output-file: 'container-sbom.spdx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-sbom
          path: container-sbom.spdx.json
          retention-days: 30

      # 4. Publish Verified Container to GitHub Container Registry (ghcr.io) on main branch
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short

      - name: Push Container to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
